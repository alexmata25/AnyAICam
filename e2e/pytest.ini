[pytest]
# Scoped to this directory only -- `pytest app/tests` (the existing unit
# suite) never collects from here, and this file never collects from
# app/tests, since neither invocation is ever pointed at the other's path.
testpaths = tests
addopts = -ra --strict-markers
markers =
    e2e: real-browser test against a live AnyAiCam VMS deployment (staging by default -- see conftest.py's production safety rail).
