<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AnyAiCam VMS Software Test Checkout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            max-width: 520px;
            margin: 60px auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.10);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin: 20px 0 5px;
        }

        .small {
            color: #666;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 20px;
            font-size: 14px;
        }

        .warning {
            margin-top: 25px;
            font-size: 13px;
            color: #b00020;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>AnyAiCam VMS Software Test</h1>

    <p>
        Stripe Sandbox checkout test for the
        AnyAiCam VMS software subscription.
    </p>

    <div class="price">
        $1.00
    </div>

    <div class="small">
        Test recurring subscription
    </div>

    <button id="checkoutButton" type="button">
        Test Stripe Checkout
    </button>

    <div id="message"></div>

    <div class="warning">
        TEST MODE ONLY — no production purchase.
    </div>

</div>

<script>
const button = document.getElementById('checkoutButton');
const message = document.getElementById('message');

button.addEventListener('click', async function () {

    button.disabled = true;
    button.textContent = 'Opening Stripe...';

    message.textContent = '';

    try {

        const response = await fetch(
            '/anyaicam-test-checkout.php',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({})
            }
        );

        const data = await response.json();

        if (!response.ok || !data.ok || !data.url) {
            throw new Error(
                data.error || 'Checkout could not be started.'
            );
        }

        window.location.href = data.url;

    } catch (error) {

        message.textContent =
            'Error: ' + error.message;

        button.disabled = false;
        button.textContent = 'Test Stripe Checkout';
    }

});
</script>

</body>
</html>
