<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customer Login | ANY AI CAM</title>
  <meta name="description" content="Continue to the secure ANY AI CAM customer portal.">
  <link rel="canonical" href="https://app.anyaicam.com/login">
  <meta http-equiv="refresh" content="2;url=https://app.anyaicam.com/login">
  <style>
    :root{--navy:#10162d;--blue:#5360df;--pink:#bd2b90}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 15% 20%,rgba(189,43,144,.28),transparent 34%),linear-gradient(135deg,#10162d,#252d65);color:#fff}
    .card{width:min(100%,560px);background:#fff;color:#17233e;padding:32px;border-radius:20px;box-shadow:0 20px 60px #05091a66;text-align:center}
    h1{margin:.2rem 0 1rem;color:#10162d}
    p{line-height:1.65;color:#58657c}
    .button{display:inline-block;margin-top:1rem;padding:13px 24px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;text-decoration:none;font-weight:900}
    .secondary{display:block;margin-top:18px;color:#5360df;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>Continue to ANY AI CAM</h1>
    <p>You are being redirected to the secure customer sign-in portal.</p>
    <a class="button" href="https://app.anyaicam.com/login">Open Customer Login</a>
    <a class="secondary" href="https://app.anyaicam.com/customer-register">Create a customer account</a>
  </main>
  <script>
    window.setTimeout(function () {
      window.location.replace("https://app.anyaicam.com/login");
    }, 1200);
  </script>
</body>
</html>
