services:
  vms:
    image: anyaicam-vms:0.1.3-ec5272f
    container_name: anyaicam-vms
    ports: ["8000:8000"]
    env_file: [/etc/anyaicam/vms.env]
    volumes:
      - /var/lib/anyaicam/vms/recordings:/app/recordings
      - /var/lib/anyaicam/vms/hls:/app/static/hls
      - /var/lib/anyaicam/vms/data-config:/opt/anyaicam/data/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health',headers={'X-Forwarded-Proto':'https'}),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
