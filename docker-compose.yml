services:
  vms:
    build: .
    container_name: anyaicam-vms
    ports:
    - 8000:8000
    # WebRTC media (MediaMTX) for viewers on the appliance's own LAN /
    # Tailscale. IPv4 only. Reachable ONLY from private/Tailscale sources:
    # enforced in Docker's DOCKER-USER chain by anyaicam-webrtc-firewall
    # (UFW cannot restrict Docker-published ports). No router port
    # forwarding is needed or used.
    - 0.0.0.0:8189:8189/udp
    env_file:
    - /etc/anyaicam/vms.env
    volumes:
    - ./app:/app
    - /var/lib/anyaicam/vms/recordings:/app/recordings
    - /var/lib/anyaicam/vms/hls:/app/static/hls
    - /var/lib/anyaicam/vms/data-config:/opt/anyaicam/data/config
    # Read-only: lets recording_uploader.py/live_relay_uploader.py/
    # analytics_sync.py/event_media_uploader.py read the appliance-agent's
    # own credential.json (STATE_DIR/credential.json in each of those
    # modules) to authenticate their own control-plane calls -- the same
    # appliance identity the agent already authenticates with, never a
    # separate or permanent AWS credential. Read-only so the VMS container
    # can never modify the agent's own identity state.
    - /var/lib/anyaicam:/var/lib/anyaicam:ro
    # Read-only: 10-install-mediamtx.sh places the real MediaMTX binary
    # on the HOST at /opt/anyaicam/mediamtx (verified checksum, root-
    # owned, mode 0755) -- confirmed live on Ryzen that without this
    # mount, webrtc_publisher.py's subprocess.Popen(MEDIAMTX_BINARY, ...)
    # inside the container silently fails with FileNotFoundError
    # (recorded as mediamtx_status='spawn_failed', never crashes the
    # process, so nothing else catches this) because the container has
    # no other path to the host filesystem outside its own explicit
    # mounts. Read-only for the same reason as the credential mount
    # above: this container only ever needs to execute the binary, never
    # write to it.
    - /opt/anyaicam/mediamtx:/opt/anyaicam/mediamtx:ro
    # Read-only: the root-owned trust anchors the installer provisions
    # (installer/12-update-signing-key.sh, 13-entitlement-signing-keys.sh).
    # The VMS verifies paid-feature entitlement snapshots against
    # entitlement_signing_keys.json here (app/appliance_entitlements.py)
    # and can never change it.
    - /etc/anyaicam-update:/etc/anyaicam-update:ro
    restart: unless-stopped
    # Bounded container log (2026-10-08): the json-file driver had no size
    # limit, so the log only ever grew (and kept every line ever written).
    # 5 x 50 MB is weeks at the Ryzen's ~6 MB/day of log text, and still
    # a hard cap if a camera gets stuck in a fast reconnect loop.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; r=urllib.request.Request('http://localhost:8000/health',
        headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
